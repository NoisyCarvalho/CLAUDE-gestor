<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rotina da loja</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root { --bg:#f4f4f1; --panel:#fff; --fg:#1d1d1b; --mut:#6b6b66; --line:#dcdcd6; --acc:#2563eb; --acc-bg:#e8effd; --ok:#16a34a; --ok-bg:#e7f6ec; --bad:#b91c1c; --ic:#7b0000; }
@media (prefers-color-scheme: dark) { :root { --bg:#141413; --panel:#1f1f1e; --fg:#f2f2ee; --mut:#a2a29b; --line:#363633; --acc:#6ea0ff; --acc-bg:#1b2741; --ok:#4ade80; --ok-bg:#14281b; --bad:#f87171; --ic:#8f1d1d; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 18px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
main { max-width: 960px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(48px, calc(env(safe-area-inset-bottom) + 24px)) max(16px, env(safe-area-inset-left)); }
h1 { font-size: 1.6rem; margin: 0; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.data { color: var(--mut); font-size: .95rem; }
.data::first-letter { text-transform: uppercase; }
button { font: inherit; font-weight: 600; font-size: 1rem; min-height: 52px; padding: 12px 20px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
button.p { background: var(--acc); border-color: var(--acc); color: #fff; }
button.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
button:disabled { opacity: .45; cursor: default; }
button.l { min-height: 0; padding: 8px 4px; border: 0; background: none; color: var(--mut); font-weight: 500; font-size: .9rem; text-decoration: underline; }
button:focus-visible, a:focus-visible, summary:focus-visible, input:focus-visible { outline: 3px solid var(--acc); outline-offset: 3px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.msg { color: var(--mut); font-size: .95rem; margin: 12px 0; text-align: center; }
.msg.e { color: var(--bad); }

/* ---------- tela central ---------- */
.menu { display: grid; gap: 18px; margin: 28px 0 24px; }
@media (min-width: 700px) { .menu { grid-template-columns: 1fr 1fr; } }
.tile { position: relative; display: flex; flex-direction: column; gap: 6px; background: var(--panel); border: 2px solid var(--line); border-radius: 22px; padding: 26px 24px 22px; color: var(--fg); text-decoration: none; min-height: 230px; }
.tile:active { transform: scale(.99); }
.tile.agora { border-color: var(--acc); }
.tile.done { border-color: var(--ok); }
.tile .ic, .cab .ic { display: grid; place-items: center; flex: none; width: 64px; height: 64px; border-radius: 18px; background: var(--ic); color: #fff; }
.tile .ic svg, .cab .ic svg { width: 36px; height: 36px; }
.tile b { font-size: 1.4rem; margin-top: 10px; }
.tile small { color: var(--mut); font-size: 1rem; }
.tile .st { margin-top: auto; padding-top: 16px; font-size: 1rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile .st.alerta { color: var(--acc); }
.tile .st.feito { color: var(--ok); }
.tag { position: absolute; top: 18px; right: 18px; background: var(--acc); color: #fff; font-size: .8rem; font-weight: 700; padding: 4px 12px; border-radius: 999px; }
.bar { height: 10px; background: var(--line); border-radius: 10px; overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .3s; }

/* ---------- página da rotina ---------- */
.voltar { display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 18px 0 12px; margin-bottom: 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--fg); font-weight: 600; text-decoration: none; }
.cab { display: flex; align-items: center; gap: 14px; }
.cab .ic { width: 54px; height: 54px; border-radius: 16px; }
.cab .ic svg { width: 30px; height: 30px; }
.quem { display: inline-block; margin-top: 6px; padding: 3px 12px; border-radius: 999px; background: var(--acc-bg); color: var(--acc); font-size: .85rem; font-weight: 600; }
.resumo { margin: 20px 0 6px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-variant-numeric: tabular-nums; }
.resumo b { font-size: 1.15rem; }
.resumo span { color: var(--mut); font-size: .95rem; }
.perm { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 16px 0 0; padding: 12px 16px; border: 1px dashed var(--acc); border-radius: 14px; }
.perm:empty { display: none; }
.perm small { color: var(--mut); flex: 1 1 220px; font-size: .95rem; }
.grade { display: grid; gap: 16px; margin-top: 20px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.item { display: flex; flex-direction: column; text-align: left; gap: 10px; padding: 0; overflow: hidden; min-height: 210px; border: 2px dashed var(--line); border-radius: 20px; background: var(--panel); font-weight: 500; }
.item .vis { height: 112px; display: grid; place-items: center; font-size: 3.2rem; background: var(--ic); color: #fff; }
.item .vis > svg { width: 54px; height: 54px; }
.item .vis img { width: 100%; height: 112px; object-fit: cover; display: block; }
.item .nome { padding: 0 16px; font-size: 1.05rem; font-weight: 600; line-height: 1.3; }
.item .est { margin-top: auto; padding: 0 16px 14px; font-size: .95rem; font-weight: 600; color: var(--acc); }
.item.feito, .item.conf { border-style: solid; border-color: var(--ok); }
.item.feito .est, .item.conf .est { color: var(--ok); }
.item.conf .vis { background: var(--ok-bg); color: var(--ok); }
.pronto { margin-top: 20px; padding: 16px 18px; border-radius: 16px; background: var(--ok-bg); color: var(--ok); font-weight: 600; text-align: center; }
.gestor { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 12px; }
.gestor summary { cursor: pointer; color: var(--mut); font-size: .95rem; padding: 10px 0; list-style-position: inside; }
.gestor summary.alerta { color: var(--acc); font-weight: 600; }
.gestor .row { justify-content: flex-start; margin-top: 8px; }

/* ---------- câmera, foto e PIN ---------- */
.ov { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.92); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); color: #fff; overflow-y: auto; animation: fade .2s ease-out; }
.ov video, .ov img { max-width: 100%; max-height: 64vh; max-height: 64dvh; border-radius: 16px; background: #000; }
.ov .tit { font-size: 1.1rem; font-weight: 600; text-align: center; max-width: 640px; }
.ov .box2 { background: var(--panel); color: var(--fg); border-radius: 18px; padding: 22px; width: min(92vw, 380px); display: flex; flex-direction: column; gap: 12px; }
.ov .box2 .row { justify-content: flex-start; }
.ov input { font: inherit; font-size: 1.5rem; letter-spacing: .4em; text-align: center; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; }
.foot { display: flex; justify-content: center; margin-top: 8px; }
/* ícone de câmera */
.shutter { width: 84px; height: 84px; min-height: 0; padding: 0; border-radius: 50%; background: #fff; color: #1d1d1b; border: 5px solid rgba(255,255,255,.45); background-clip: padding-box; display: grid; place-items: center; }
.shutter svg { width: 36px; height: 36px; }
.ov .row { align-items: center; }
.cam-ic { width: 44px; height: 44px; border-radius: 50%; background: var(--acc); color: #fff; display: grid; place-items: center; }
.cam-ic svg { width: 22px; height: 22px; }

/* ---------- animações ---------- */
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes entra { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
@keyframes pop { 0% { transform: scale(.94) } 55% { transform: scale(1.04) } 100% { transform: scale(1) } }
@keyframes tracar { to { stroke-dashoffset: 0 } }
@keyframes cai { 0% { transform: translate(0, 0) rotate(0); opacity: 1 } 100% { transform: translate(var(--dx), 105vh) rotate(var(--r)); opacity: 0 } }
.entra { animation: entra .28s ease-out; }
.entra .tile, .entra .item { animation: entra .38s ease-out backwards; animation-delay: calc(var(--n, 0) * 60ms); }
.item .vis { position: relative; }
.selo { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
.selo svg { width: 18px; height: 18px; }
.selo path { stroke-dasharray: 24; stroke-dashoffset: 0; }
.item.novo { animation: pop .45s ease-out; }
.item.novo .selo path { stroke-dashoffset: 24; animation: tracar .4s .12s ease-out forwards; }
.pronto:not([hidden]) { animation: entra .35s ease-out; }
.confete { position: fixed; inset: 0; z-index: 20; pointer-events: none; overflow: hidden; }
.confete i { position: absolute; top: -14px; width: 9px; height: 14px; border-radius: 2px; animation: cai 1.5s ease-in forwards; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
  .confete { display: none; }
}

/* ---------- celular ---------- */
@media (max-width: 520px) {
  body { font-size: 17px; }
  h1 { font-size: 1.35rem; }
  .menu { gap: 14px; margin: 20px 0 16px; }
  .tile { min-height: 190px; padding: 22px 20px 18px; }
  .grade { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .item { min-height: 190px; }
  .item .nome { padding: 0 12px; font-size: 1rem; }
  .item .est { padding: 0 12px 12px; font-size: .88rem; }
  .row button:not(.shutter) { flex: 1 1 140px; }
}
@media (max-height: 500px) and (orientation: landscape) {
  .ov { flex-direction: row; flex-wrap: wrap; gap: 10px 18px; }
  .ov .tit { flex: 1 0 100%; font-size: 1rem; }
  .ov video, .ov img { max-height: 62dvh; max-width: 62vw; }
  .shutter { width: 68px; height: 68px; }
}
</style>
</head>
<body>
<main>
  <!-- Tela central -->
  <section id="home">
    <div class="top"><h1>Rotina da loja</h1><span class="data" id="data"></span></div>
    <nav class="menu" id="menu" aria-label="Rotinas"></nav>
    <div class="foot"><button class="l" id="trocapin" type="button">Alterar PIN do gestor</button></div>
  </section>

  <!-- Página de uma rotina -->
  <section id="pag" hidden>
    <a class="voltar" href="#">‹ Início</a>
    <div class="cab"><span class="ic" id="pag-ic" aria-hidden="true"></span><div><h1 id="titulo"></h1><span class="quem" id="quem"></span></div></div>
    <div class="resumo"><b id="prog"></b><span>Toque em cada item e tire a foto</span></div>
    <div class="bar" aria-hidden="true"><i id="fill"></i></div>
    <div class="perm" id="perm"></div>
    <div class="grade" id="grade"></div>
    <div class="pronto" id="pronto" hidden></div>
    <details class="gestor" id="gestor">
      <summary id="gestor-sum">Área do gestor</summary>
      <div class="row">
        <button class="p" id="conferir" type="button">Conferir e apagar as fotos</button>
        <button id="limpar" type="button">Limpar esta lista</button>
      </div>
    </details>
  </section>

  <div class="msg" id="msg" role="status" hidden></div>
</main>

<script>
/* ============ ROTINAS (edite aqui) ============
   Cada rotina vira um botão na tela central e uma página.
   Todo item pede foto: o Rodrigo tira a foto e confirma; o gestor confere com o PIN e as fotos são apagadas.
   i = ícone do item, t = texto do item. */
const ROTINAS = {
  abertura: {
    titulo: 'Abertura Loja · Logística', icone: 'sol', resumo: 'Montar a área dos entregadores', quem: 'Rodrigo',
    itens: [
      { i: 'cone', t: 'Posicionar os cones no estacionamento' },
      { i: 'lixo', t: 'Colocar a sacola de lixo na árvore dos entregadores' },
      { i: 'cafe', t: 'Colocar a garrafa de café' },
      { i: 'acucar', t: 'Colocar o açúcar com a colher' },
      { i: 'copo', t: 'Colocar os copos descartáveis' }
    ]
  },
  fechamento: {
    titulo: 'Fechamento Loja · Logística', icone: 'lua', resumo: 'Guardar tudo no fim da noite', quem: 'Rodrigo',
    itens: [
      { i: 'cone', t: 'Recolher os cones do estacionamento' },
      { i: 'lixo', t: 'Tirar a sacola de lixo da árvore' },
      { i: 'cafe', t: 'Guardar a garrafa de café' },
      { i: 'acucar', t: 'Guardar o açúcar e a colher' },
      { i: 'copo', t: 'Guardar os copos descartáveis' },
      { i: 'cadeira', t: 'Subir de volta as cadeiras dos entregadores' }
    ]
  }
};
const ICONES = {   // ícones de linha, 24x24 (traço branco sobre o quadrado vermelho)
  sol: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8"/>',
  lua: '<path d="M20 14.6A8.2 8.2 0 1 1 9.4 4a6.6 6.6 0 0 0 10.6 10.6z"/>',
  cone: '<path d="M9.6 4.5h4.8l3.2 15H6.4z"/><path d="M4.5 19.5h15M8.3 11h7.4M7.4 15.2h9.2"/>',
  lixo: '<path d="M4 7h16M9.5 7V4.5h5V7M6.3 7l1 13h9.4l1-13M10 11v6M14 11v6"/>',
  cafe: '<g transform="rotate(35 12 12)"><ellipse cx="12" cy="12" rx="5.4" ry="9"/><path d="M12 3.4c-3 3.2 3 5.4 0 8.6s3 5.4 0 8.6"/></g>',
  acucar: '<g transform="rotate(35 12 12)"><ellipse cx="12" cy="6" rx="3" ry="4.2"/><path d="M12 10.2c0 3-.6 4-.6 5.2V21.5"/></g>',
  copo: '<path d="M6 4h12l-1.6 16.2a1 1 0 0 1-1 .8H8.6a1 1 0 0 1-1-.8z"/><path d="M6.7 9.5h10.6"/>',
  cadeira: '<path d="M7.5 3.5v17M7.5 12.5h10v8M7.5 7.5h4.5"/>'
};
const SVG = (n) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONES[n] + '</svg>';
const CAM_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>';
const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const reduz = matchMedia('(prefers-reduced-motion: reduce)').matches;
let novoK = '';                                    // último item marcado (para animar só ele)
const vibra = (ms) => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };
const anima = (s) => { s.classList.remove('entra'); void s.offsetWidth; s.classList.add('entra'); setTimeout(() => s.classList.remove('entra'), 900); };
const confete = () => {
  if (reduz) return;
  const c = el('div', 'confete'), cores = ['var(--acc)', 'var(--ok)', '#f59e0b', '#ec4899'];
  for (let n = 0; n < 28; n++) {
    const i = el('i'); i.style.left = (Math.random() * 100) + '%'; i.style.background = cores[n % 4];
    i.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px'); i.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
    i.style.animationDelay = (Math.random() * .35) + 's'; c.append(i);
  }
  document.body.append(c); setTimeout(() => c.remove(), 2200);
};
const HORA_FECHAMENTO = 16;   // a partir dessa hora a tela central destaca o Fechamento
const PAGS = Object.keys(ROTINAS);
const ITENS = {};
PAGS.forEach(pg => { ITENS[pg] = ROTINAS[pg].itens.map((it, n) => ({ ...it, pg, k: pg + ':' + n })); });

/* ============ armazenamento local (só neste tablet) ============ */
const KEY = 'rotina-loja-v3', PINKEY = 'rotina-loja-pin';
const diaSP = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo' }).format(new Date());
const horaSP = () => Number(new Intl.DateTimeFormat('en-GB', { timeZone: 'America/Sao_Paulo', hour: '2-digit', hourCycle: 'h23' }).format(new Date()));
let hoje = diaSP();
let mem = { dia: hoje, s: {} };           // plano B se o navegador bloquear o armazenamento
const ler = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const gravarLS = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };
const carregar = () => { try { const o = JSON.parse(ler(KEY)); if (o && o.dia === hoje) return o; } catch (e) {} return mem.dia === hoje ? mem : { dia: hoje, s: {} }; };
let est = carregar();
const salvar = () => { if (!gravarLS(KEY, JSON.stringify(est))) mem = est; };
const novoDia = () => { const d = diaSP(); if (d !== hoje) { hoje = d; est = carregar(); } };   // tablet aberto de um dia para o outro

/* ============ utilidades ============ */
const $ = (id) => document.getElementById(id);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const btn = (txt, fn, cls) => { const b = el('button', cls, txt); b.type = 'button'; b.addEventListener('click', fn); return b; };
const aviso = (t, erro) => { const m = $('msg'); m.textContent = t || ''; m.hidden = !t; m.className = 'msg' + (erro ? ' e' : ''); };
const dataHoje = () => new Intl.DateTimeFormat('pt-BR', { timeZone: 'America/Sao_Paulo', weekday: 'long', day: '2-digit', month: 'long' }).format(new Date());
const hhmm = (iso) => new Intl.DateTimeFormat('pt-BR', { timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit' }).format(new Date(iso));
const doHash = () => { const h = location.hash.slice(1); return ROTINAS[h] ? h : ''; };
let atual = doHash();                       // página aberta (não depende só do #, que alguns navegadores/visualizadores bloqueiam)
const pagina = () => atual;
const ir = (pg) => { atual = pg; try { location.hash = pg ? '#' + pg : ''; } catch (e) {} aviso(''); render(true); };
const itemDe = (k) => ITENS[k.split(':')[0]].find(x => x.k === k);
const overlay = () => { const ov = el('div', 'ov'); ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); document.body.appendChild(ov); return ov; };

/* ---- metadados EXIF (data, hora e passo) gravados dentro do JPEG ---- */
const agoraSP = () => {   // data/hora de São Paulo
  const o = {}; new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' })
    .formatToParts(new Date()).forEach(x => { o[x.type] = x.value; });
  return `${o.year}:${o.month}:${o.day} ${o.hour}:${o.minute}:${o.second}`;
};
const ascii = (t) => t.replace(/·/g, '-').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\x20-\x7e]/g, '?');
function comExif(dataUrl, descricao) {
  const bin = atob(dataUrl.split(',')[1]), jpg = Uint8Array.from(bin, c => c.charCodeAt(0));
  const dt = agoraSP() + '\0', desc = ascii(descricao) + '\0';
  const tiff = new Uint8Array(140 + desc.length), v = new DataView(tiff.buffer);
  tiff.set([0x4d, 0x4d, 0, 0x2a], 0); v.setUint32(4, 8);                 // cabeçalho TIFF (big-endian)
  const ent = (o, tag, n, off) => { v.setUint16(o, tag); v.setUint16(o + 2, 2); v.setUint32(o + 4, n); v.setUint32(o + 8, off); };
  v.setUint16(8, 3);                                                     // IFD0: 3 campos
  ent(10, 0x010e, desc.length, 140);                                      // descrição
  ent(22, 0x0132, 20, 80);                                                // data/hora
  v.setUint16(34, 0x8769); v.setUint16(36, 4); v.setUint32(38, 1); v.setUint32(42, 50);  // ponteiro p/ Exif
  v.setUint32(46, 0);
  v.setUint16(50, 2);                                                    // Exif IFD: 2 campos
  ent(52, 0x9003, 20, 100); ent(64, 0x9004, 20, 120); v.setUint32(76, 0);
  [...dt].forEach((c, i) => { tiff[80 + i] = tiff[100 + i] = tiff[120 + i] = c.charCodeAt(0); });
  [...desc].forEach((c, i) => { tiff[140 + i] = c.charCodeAt(0); });
  const cab = [0x45, 0x78, 0x69, 0x66, 0, 0], len = 2 + cab.length + tiff.length;
  const app1 = new Uint8Array(2 + len); app1.set([0xff, 0xe1, len >> 8, len & 255], 0); app1.set(cab, 4); app1.set(tiff, 4 + cab.length);
  let pos = 2;                                                           // depois do SOI (e do JFIF, se houver)
  if (jpg[2] === 0xff && jpg[3] === 0xe0) pos = 4 + ((jpg[4] << 8) | jpg[5]);
  const out = new Uint8Array(jpg.length + app1.length); out.set(jpg.subarray(0, pos), 0); out.set(app1, pos); out.set(jpg.subarray(pos), pos + app1.length);
  let s2 = ''; for (let i = 0; i < out.length; i += 8192) s2 += String.fromCharCode.apply(null, out.subarray(i, i + 8192));
  return 'data:image/jpeg;base64,' + btoa(s2);
}

/* foto -> JPEG pequeno */
const reduzir = (fonte, descricao) => new Promise((ok, erro) => {
  const img = new Image(), url = URL.createObjectURL(fonte);
  img.onload = () => {
    let m = 800, q = .7, out = '';
    for (let n = 0; n < 4; n++) {
      const r = Math.min(1, m / Math.max(img.width, img.height)), c = el('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      out = c.toDataURL('image/jpeg', q);
      if (out.length < 200000) break;
      m *= .75; q -= .1;
    }
    URL.revokeObjectURL(url);
    try { out = comExif(out, descricao); } catch (e) { /* sem EXIF, mantém a foto */ }
    ok(out);
  };
  img.onerror = () => { URL.revokeObjectURL(url); erro(new Error('img')); };
  img.src = url;
});

/* ============ câmera: tirar -> ver -> confirmar ============ */
const temCam = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
let camOk = false;
const pedirCam = async () => {
  if (!temCam) return null;
  try { const st = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false }); camOk = true; return st; }
  catch (e) { return null; }
};
const descricaoDe = (it) => { const r = ROTINAS[it.pg]; return `${r.titulo} | ${it.t} | ${r.quem}`; };
const confirmar = (k, foto) => {                 // mostra a foto tirada: está certo ou tirar de novo
  const it = itemDe(k), ov = overlay(), im = el('img'); im.src = foto; im.alt = 'Foto tirada';
  const row = el('div', 'row');
  row.append(
    btn('✔ Está certo', () => { ov.remove(); novoK = k; est.s[k] = { estado: 'feito', foto, em: new Date().toISOString() }; salvar(); aviso(''); desenha(it.pg); vibra(35); const sc = situacao(it.pg); if (sc.feitos === sc.total) { vibra([60, 40, 90]); confete(); } }, 'ok'),
    btn('↺ Tirar de novo', () => { ov.remove(); tirarFoto(k); }),
    btn('Cancelar', () => ov.remove()));
  ov.append(el('div', 'tit', it.t), im, row);
};
const processar = async (k, fonte) => {
  try { confirmar(k, await reduzir(fonte, descricaoDe(itemDe(k)))); }
  catch (e) { aviso('Não deu para ler a foto. Tente de novo.', true); }
};
const viaArquivo = (k) => {                      // plano B: câmera do sistema
  const i = el('input'); i.type = 'file'; i.accept = 'image/*'; i.setAttribute('capture', 'environment');
  i.addEventListener('change', () => { if (i.files && i.files[0]) processar(k, i.files[0]); });
  i.click();
};
const tirarFoto = async (k) => {
  const it = itemDe(k), st = await pedirCam();
  atualizaPerm(it.pg);
  if (!st) { viaArquivo(k); return; }
  aviso('');
  const ov = overlay(), v = el('video'); v.autoplay = true; v.playsInline = true; v.muted = true; v.srcObject = st;
  const fecha = () => { st.getTracks().forEach(t => t.stop()); ov.remove(); };
  const row = el('div', 'row');
  const sh = btn('', async () => {
    if (!v.videoWidth) return;
    const c = el('canvas'); c.width = v.videoWidth; c.height = v.videoHeight; c.getContext('2d').drawImage(v, 0, 0);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .9)); fecha(); processar(k, blob);
  }, 'shutter');
  sh.innerHTML = CAM_SVG; sh.setAttribute('aria-label', 'Tirar foto');
  row.append(sh, btn('Cancelar', fecha));
  ov.append(el('div', 'tit', it.t), v, row);
};
const verFoto = (k) => {                         // item já feito: ver a foto ou refazer
  const it = itemDe(k), e = est.s[k], ov = overlay(), im = el('img'); im.src = e.foto; im.alt = 'Foto do item';
  const row = el('div', 'row');
  row.append(btn('↺ Tirar de novo', () => { ov.remove(); tirarFoto(k); }), btn('Fechar', () => ov.remove(), 'p'));
  ov.append(el('div', 'tit', `${it.t} · foto das ${hhmm(e.em)}`), im, row);
};
const atualizaPerm = async (pg) => {
  const p = $('perm'); p.textContent = '';
  if (!temCam || camOk || !pg) return;
  let s = 'prompt';
  try { if (navigator.permissions) s = (await navigator.permissions.query({ name: 'camera' })).state; } catch (e) {}
  if (s !== 'prompt' || camOk) return;
  p.append(el('small', '', 'Antes de começar, libere a câmera deste tablet.'));
  p.append(btn('Permitir câmera', async () => { const st = await pedirCam(); if (st) st.getTracks().forEach(t => t.stop()); atualizaPerm(pg); }, 'p'));
};

/* ============ PIN do gestor ============ */
const pedirPin = (titulo, criar) => new Promise((res) => {
  const ov = overlay(), b = el('div', 'box2');
  const i = el('input'); i.type = 'password'; i.inputMode = 'numeric'; i.maxLength = 4; i.autocomplete = 'off'; i.setAttribute('aria-label', 'PIN de 4 números');
  const e = el('small', '', criar ? 'Escolha 4 números. Só o gestor deve saber.' : ''); e.style.color = 'var(--mut)';
  const r = el('div', 'row'), fim = (v) => { ov.remove(); res(v); };
  r.append(btn('OK', () => { if (/^\d{4}$/.test(i.value)) fim(i.value); else { e.textContent = 'Use 4 números.'; e.style.color = 'var(--bad)'; } }, 'p'), btn('Cancelar', () => fim(null)));
  i.addEventListener('keydown', ev => { if (ev.key === 'Enter') r.firstChild.click(); });
  b.append(el('b', '', titulo), i, e, r); ov.append(b); i.focus();
});
const sha = async (t) => { try { const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('rotina:' + t)); return [...new Uint8Array(h)].map(x => x.toString(16).padStart(2, '0')).join(''); } catch (e) { return 'x:' + t; } };
const checaPin = async () => {
  let h = ler(PINKEY);
  if (!h) { const n = await pedirPin('Crie o PIN do gestor', true); if (!n) return false; gravarLS(PINKEY, await sha(n)); return true; }
  const p = await pedirPin('PIN do gestor'); if (!p) return false;
  if (await sha(p) === h) return true;
  aviso('PIN incorreto.', true); return false;
};

/* ============ progresso ============ */
const situacao = (pg) => {
  let feitos = 0, aguardando = 0;
  ITENS[pg].forEach(it => { const e = est.s[it.k]; if (e) feitos++; if (e && e.estado === 'feito') aguardando++; });
  return { feitos, total: ITENS[pg].length, aguardando, conferido: feitos === ITENS[pg].length && !aguardando };
};
const textoSituacao = (s) => s.conferido ? 'Tudo conferido ✓' : s.feitos === s.total ? `Tudo pronto · ${s.aguardando} foto(s) para o gestor conferir` : s.feitos ? `${s.feitos} de ${s.total} prontos` : 'Ainda não começou';

/* ============ tela central ============ */
function inicio() {
  $('data').textContent = dataHoje();
  const M = $('menu'); M.textContent = '';
  const agora = horaSP() < HORA_FECHAMENTO ? 'abertura' : 'fechamento';
  PAGS.forEach((pg, n) => {
    const r = ROTINAS[pg], s = situacao(pg), completo = s.feitos === s.total;
    const a = el('a', 'tile' + (completo ? ' done' : pg === agora ? ' agora' : '')); a.href = '#' + pg; a.style.setProperty('--n', n);
    a.addEventListener('click', ev => { ev.preventDefault(); ir(pg); });
    if (pg === agora && !completo) a.append(el('span', 'tag', 'Agora'));
    const ico = el('span', 'ic'); ico.innerHTML = SVG(r.icone);
    a.append(ico, el('b', '', r.titulo), el('small', '', r.resumo));
    const st = el('span', 'st' + (s.aguardando ? ' alerta' : completo ? ' feito' : ''), textoSituacao(s));
    const bar = el('div', 'bar'), i = el('i'); i.style.width = (s.total ? s.feitos / s.total * 100 : 0) + '%'; bar.append(i);
    a.append(st, bar); M.append(a);
  });
}

/* ============ página de uma rotina ============ */
function desenha(pg) {
  const R = ROTINAS[pg], s = situacao(pg);
  $('titulo').textContent = R.titulo; $('pag-ic').innerHTML = SVG(R.icone); $('quem').textContent = 'Responsável: ' + R.quem; document.title = R.titulo;
  $('prog').textContent = `${s.feitos} de ${s.total} prontos`;
  $('fill').style.width = (s.total ? s.feitos / s.total * 100 : 0) + '%';
  const G = $('grade'); G.textContent = '';
  ITENS[pg].forEach((it, n) => {
    const e = est.s[it.k], feito = e && e.estado === 'feito', conf = e && e.estado === 'ok';
    const b = el('button', 'item' + (feito ? ' feito' : conf ? ' conf' : '') + (it.k === novoK ? ' novo' : '')); b.type = 'button'; b.style.setProperty('--n', n);
    const vis = el('span', 'vis');
    if (feito) { const im = el('img'); im.src = e.foto; im.alt = ''; vis.append(im); const sl = el('span', 'selo'); sl.innerHTML = CHECK_SVG; vis.append(sl); } else if (conf) vis.textContent = '✓'; else vis.innerHTML = SVG(it.i);
    const est_ = el('span', 'est', conf ? 'Conferido pelo gestor ✓' : feito ? `Pronto ✓ · foto das ${hhmm(e.em)}` : null);
    if (!conf && !feito) { const ic = el('span', 'cam-ic'); ic.innerHTML = CAM_SVG; est_.append(ic); }
    b.append(vis, el('span', 'nome', it.t), est_);
    b.setAttribute('aria-label', `${it.t}. ${conf ? 'Conferido pelo gestor' : feito ? 'Pronto' : 'Falta tirar a foto'}`);
    if (conf) b.disabled = true;
    else b.addEventListener('click', () => feito ? verFoto(it.k) : tirarFoto(it.k));
    G.append(b);
  });
  novoK = '';
  const P = $('pronto');
  P.hidden = s.feitos !== s.total;
  P.textContent = s.conferido ? 'Tudo conferido pelo gestor ✓' : 'Tudo pronto! Avise o gestor para conferir as fotos.';
  $('conferir').disabled = !s.aguardando;
  $('conferir').textContent = s.aguardando ? `Conferir e apagar ${s.aguardando} foto(s)` : 'Nenhuma foto para conferir';
  const sum = $('gestor-sum'); sum.textContent = s.aguardando ? `Área do gestor · ${s.aguardando} foto(s) para conferir` : 'Área do gestor'; sum.className = s.aguardando ? 'alerta' : '';
}

/* ============ navegação ============ */
function render(rolar) {
  novoDia();
  const pg = pagina();
  $('home').hidden = !!pg; $('pag').hidden = !pg;
  if (pg) { desenha(pg); atualizaPerm(pg); } else { document.title = 'Rotina da loja'; inicio(); }
  if (rolar) { window.scrollTo(0, 0); $('gestor').open = false; anima(pg ? $('pag') : $('home')); }
}
window.addEventListener('hashchange', () => { atual = doHash(); aviso(''); render(true); });
document.querySelector('.voltar').addEventListener('click', ev => { ev.preventDefault(); ir(''); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(false); });

$('conferir').addEventListener('click', async () => {
  const pg = pagina(); if (!pg || !(await checaPin())) return;
  ITENS[pg].forEach(it => { const e = est.s[it.k]; if (e && e.estado === 'feito') est.s[it.k] = { estado: 'ok', em: e.em }; });  // a foto some junto
  salvar(); aviso('Conferido. As fotos foram apagadas.'); desenha(pg);
});
$('limpar').addEventListener('click', async () => {
  const pg = pagina(); if (!pg || !(await checaPin())) return;
  ITENS[pg].forEach(it => { delete est.s[it.k]; }); salvar(); aviso('Lista limpa.'); desenha(pg);
});
$('trocapin').addEventListener('click', async () => {
  if (ler(PINKEY) && !(await checaPin())) return;
  const n = await pedirPin('Novo PIN do gestor', true); if (n) { gravarLS(PINKEY, await sha(n)); aviso('PIN alterado.'); }
});
if (!(() => { try { localStorage.setItem('t', '1'); localStorage.removeItem('t'); return true; } catch (e) { return false; } })()) aviso('Este navegador não guarda dados. Ao fechar a página, as marcações se perdem.', true);
render(true);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
