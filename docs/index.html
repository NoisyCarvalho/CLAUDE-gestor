<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rotina da loja</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root { --bg:#f6f6f4; --panel:#fff; --fg:#1d1d1b; --mut:#6b6b66; --line:#dcdcd6; --acc:#2563eb; --ok:#16a34a; --bad:#b91c1c; }
@media (prefers-color-scheme: dark) { :root { --bg:#161615; --panel:#212120; --fg:#f2f2ee; --mut:#a2a29b; --line:#363633; --acc:#6ea0ff; --ok:#4ade80; --bad:#f87171; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 18px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 1.5rem; margin: 0; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.data { color: var(--mut); font-size: .9rem; }
.data::first-letter { text-transform: uppercase; }
.prog { color: var(--mut); font-size: .95rem; margin-top: 12px; font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--line); border-radius: 8px; overflow: hidden; margin: 6px 0 18px; }
.bar i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .25s; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 6px 16px 16px; margin-bottom: 16px; }
.grp { margin: 14px 0 4px; font-size: .8rem; font-weight: 700; color: var(--mut); text-transform: uppercase; letter-spacing: .05em; }
.quem { display: inline-block; margin-left: 8px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--acc); color: var(--acc); font-size: .8rem; text-transform: none; letter-spacing: 0; }
.it { display: flex; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }
.it:first-of-type { border-top: 0; }
.box { flex: none; width: 28px; height: 28px; margin-top: 1px; border: 2px solid var(--line); border-radius: 9px; background: var(--panel); display: grid; place-content: center; }
.box.on { background: var(--ok); border-color: var(--ok); }
.box.on::after { content: ''; width: 7px; height: 13px; border: solid #fff; border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px,-1px); }
.it.ok .txt > span { color: var(--mut); text-decoration: line-through; }
.txt { min-width: 0; flex: 1; }
.acts { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.acts small { color: var(--mut); font-size: .85rem; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
button { font: inherit; font-weight: 600; font-size: .95rem; min-height: 48px; padding: 10px 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
button.p { background: var(--acc); border-color: var(--acc); color: #fff; }
button.l { min-height: 0; padding: 6px 4px; border: 0; background: none; color: var(--mut); font-weight: 500; font-size: .85rem; text-decoration: underline; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
img.f { width: 140px; max-width: 100%; border-radius: 12px; border: 1px solid var(--line); cursor: zoom-in; display: block; }
img.f.big { width: 100%; max-width: 480px; cursor: zoom-out; }
.msg { color: var(--mut); font-size: .9rem; margin: 6px 0 12px; }
.msg.e { color: var(--bad); }
.perm { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; padding: 12px 14px; border: 1px dashed var(--acc); border-radius: 14px; }
.perm:empty { display: none; }
.perm small { color: var(--mut); flex: 1 1 200px; }
.ov { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.9); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 16px; }
.ov video { max-width: 100%; max-height: 72vh; border-radius: 14px; background: #000; }
.ov .box2 { background: var(--panel); border-radius: 16px; padding: 20px; width: min(92vw, 360px); display: flex; flex-direction: column; gap: 12px; }
.ov input { font: inherit; font-size: 1.4rem; letter-spacing: .4em; text-align: center; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; }
.foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <div class="top"><h1>Rotina da loja</h1><span class="data" id="data"></span></div>
  <div class="prog" id="prog"></div>
  <div class="bar" aria-hidden="true"><i id="fill"></i></div>
  <div class="perm" id="perm"></div>
  <div class="card" id="lista"></div>
  <div class="row" style="margin-bottom:10px"><button class="p" id="conferir" type="button" hidden>Conferir e apagar as fotos (gestor)</button></div>
  <div class="msg" id="msg" role="status" hidden></div>
  <div class="foot">
    <button class="l" id="limpar" type="button">Limpar o dia</button>
    <button class="l" id="trocapin" type="button">Alterar PIN do gestor</button>
  </div>
</main>

<script>
/* ============ ROTINA (edite aqui) ============
   foto:true  -> o responsável tira a foto e dá o check (sem senha). O gestor depois confere com o PIN e as fotos são apagadas.
   foto:false -> caixinha simples de marcar. */
const ROTINA = [
  { grupo: 'Abertura (chegando na loja)', quem: 'Rodrigo Neves · CLT', itens: [
    { t: 'Posicionar os cones no espaço onde ficam as motos.', foto: true },
    { t: 'Posicionar uma sacola de lixo na árvore onde os entregadores costumam ficar parados.', foto: true },
    { t: 'Posicionar o protetor solar na janela do delivery.', foto: true }
  ] },
  { grupo: 'Durante o dia', itens: [
    { t: 'Começar a mandar as rotas do sistema.', foto: false }
  ] }
];

/* ============ armazenamento local (só neste tablet) ============ */
const KEY = 'rotina-loja-v1', PINKEY = 'rotina-loja-pin';
const hoje = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo' }).format(new Date());
let mem = { dia: hoje, s: {} };           // plano B se o navegador bloquear o armazenamento
const ler = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const gravarLS = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };
const carregar = () => { try { const o = JSON.parse(ler(KEY)); if (o && o.dia === hoje) return o; } catch (e) {} return { dia: hoje, s: {} }; };
let est = carregar();
const salvar = () => { if (!gravarLS(KEY, JSON.stringify(est))) mem = est; };

/* ============ utilidades ============ */
const $ = (id) => document.getElementById(id);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const btn = (txt, fn, cls) => { const b = el('button', cls, txt); b.type = 'button'; b.addEventListener('click', fn); return b; };
const aviso = (t, erro) => { const m = $('msg'); m.textContent = t || ''; m.hidden = !t; m.className = 'msg' + (erro ? ' e' : ''); };
$('data').textContent = new Intl.DateTimeFormat('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' }).format(new Date());

const itens = []; ROTINA.forEach((g, gi) => g.itens.forEach(it => itens.push({ ...it, gi, k: 'p' + itens.length })));

/* ---- metadados EXIF (data, hora e passo) gravados dentro do JPEG ---- */
const agoraSP = () => {   // data/hora de São Paulo
  const o = {}; new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' })
    .formatToParts(new Date()).forEach(x => { o[x.type] = x.value; });
  return `${o.year}:${o.month}:${o.day} ${o.hour}:${o.minute}:${o.second}`;
};
const ascii = (t) => t.replace(/·/g, '-').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\x20-\x7e]/g, '?');
function comExif(dataUrl, descricao) {
  const bin = atob(dataUrl.split(',')[1]), jpg = Uint8Array.from(bin, c => c.charCodeAt(0));
  const dt = agoraSP() + '\0', desc = ascii(descricao) + '\0';
  const tiff = new Uint8Array(140 + desc.length), v = new DataView(tiff.buffer);
  tiff.set([0x4d, 0x4d, 0, 0x2a], 0); v.setUint32(4, 8);                 // cabeçalho TIFF (big-endian)
  const ent = (o, tag, n, off) => { v.setUint16(o, tag); v.setUint16(o + 2, 2); v.setUint32(o + 4, n); v.setUint32(o + 8, off); };
  v.setUint16(8, 3);                                                     // IFD0: 3 campos
  ent(10, 0x010e, desc.length, 140);                                      // descrição
  ent(22, 0x0132, 20, 80);                                                // data/hora
  v.setUint16(34, 0x8769); v.setUint16(36, 4); v.setUint32(38, 1); v.setUint32(42, 50);  // ponteiro p/ Exif
  v.setUint32(46, 0);
  v.setUint16(50, 2);                                                    // Exif IFD: 2 campos
  ent(52, 0x9003, 20, 100); ent(64, 0x9004, 20, 120); v.setUint32(76, 0);
  [...dt].forEach((c, i) => { tiff[80 + i] = tiff[100 + i] = tiff[120 + i] = c.charCodeAt(0); });
  [...desc].forEach((c, i) => { tiff[140 + i] = c.charCodeAt(0); });
  const cab = [0x45, 0x78, 0x69, 0x66, 0, 0], len = 2 + cab.length + tiff.length;
  const app1 = new Uint8Array(2 + len); app1.set([0xff, 0xe1, len >> 8, len & 255], 0); app1.set(cab, 4); app1.set(tiff, 4 + cab.length);
  let pos = 2;                                                           // depois do SOI (e do JFIF, se houver)
  if (jpg[2] === 0xff && jpg[3] === 0xe0) pos = 4 + ((jpg[4] << 8) | jpg[5]);
  const out = new Uint8Array(jpg.length + app1.length); out.set(jpg.subarray(0, pos), 0); out.set(app1, pos); out.set(jpg.subarray(pos), pos + app1.length);
  let s2 = ''; for (let i = 0; i < out.length; i += 8192) s2 += String.fromCharCode.apply(null, out.subarray(i, i + 8192));
  return 'data:image/jpeg;base64,' + btoa(s2);
}

/* foto -> JPEG pequeno */
const reduzir = (fonte, descricao) => new Promise((ok, erro) => {
  const img = new Image(), url = URL.createObjectURL(fonte);
  img.onload = () => {
    let m = 800, q = .7, out = '';
    for (let n = 0; n < 4; n++) {
      const r = Math.min(1, m / Math.max(img.width, img.height)), c = el('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      out = c.toDataURL('image/jpeg', q);
      if (out.length < 200000) break;
      m *= .75; q -= .1;
    }
    URL.revokeObjectURL(url);
    try { out = comExif(out, descricao); } catch (e) { /* sem EXIF, mantém a foto */ }
    ok(out);
  };
  img.onerror = () => { URL.revokeObjectURL(url); erro(new Error('img')); };
  img.src = url;
});

/* ============ câmera ============ */
const temCam = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
let camOk = false;
const pedirCam = async () => {
  if (!temCam) return null;
  try { const st = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false }); camOk = true; return st; }
  catch (e) { return null; }
};
const guardarFoto = async (k, fonte) => {
  try { const it = itens.find(x => x.k === k), g = ROTINA[it.gi];
    est.s[k] = { estado: 'enviada', foto: await reduzir(fonte, `Rotina da loja | ${it.t}${g.quem ? ' | ' + g.quem : ''}`), em: new Date().toISOString() }; salvar(); aviso(''); }
  catch (e) { aviso('Não deu para ler a foto. Tente de novo.', true); }
  desenha();
};
const viaArquivo = (k) => {
  const i = el('input'); i.type = 'file'; i.accept = 'image/*'; i.setAttribute('capture', 'environment');
  i.addEventListener('change', () => { if (i.files && i.files[0]) guardarFoto(k, i.files[0]); });
  i.click();
};
const tirarFoto = async (k) => {
  const st = await pedirCam();
  if (!st) { aviso('Câmera não liberada. Usando a câmera do sistema.'); viaArquivo(k); return; }
  aviso('');
  const ov = el('div', 'ov'), v = el('video'); v.autoplay = true; v.playsInline = true; v.muted = true; v.srcObject = st;
  const fecha = () => { st.getTracks().forEach(t => t.stop()); ov.remove(); };
  const row = el('div', 'row');
  row.append(
    btn('📸 Capturar', async () => {
      if (!v.videoWidth) return;
      const c = el('canvas'); c.width = v.videoWidth; c.height = v.videoHeight; c.getContext('2d').drawImage(v, 0, 0);
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .9)); fecha(); guardarFoto(k, blob);
    }, 'p'),
    btn('Cancelar', fecha));
  ov.append(v, row); document.body.appendChild(ov);
};
const atualizaPerm = async () => {
  const p = $('perm'); p.textContent = '';
  if (!temCam || camOk) return;
  let s = 'prompt';
  try { if (navigator.permissions) s = (await navigator.permissions.query({ name: 'camera' })).state; } catch (e) {}
  if (s === 'granted' || s === 'denied') return;
  p.append(el('small', '', 'Para tirar as fotos, libere a câmera deste tablet.'));
  p.append(btn('Permitir câmera', async () => { const st = await pedirCam(); if (st) st.getTracks().forEach(t => t.stop()); atualizaPerm(); }, 'p'));
};

/* ============ PIN do gestor (para confirmar) ============ */
const pedirPin = (titulo, criar) => new Promise((res) => {
  const ov = el('div', 'ov'), b = el('div', 'box2');
  const i = el('input'); i.type = 'password'; i.inputMode = 'numeric'; i.maxLength = 4; i.autocomplete = 'off'; i.setAttribute('aria-label', 'PIN de 4 números');
  const e = el('small', '', criar ? 'Escolha 4 números. Só o gestor deve saber.' : ''); e.style.color = 'var(--mut)';
  const r = el('div', 'row'), fim = (v) => { ov.remove(); res(v); };
  r.append(btn('OK', () => { if (/^\d{4}$/.test(i.value)) fim(i.value); else { e.textContent = 'Use 4 números.'; e.style.color = 'var(--bad)'; } }, 'p'), btn('Cancelar', () => fim(null)));
  i.addEventListener('keydown', ev => { if (ev.key === 'Enter') r.firstChild.click(); });
  b.append(el('b', '', titulo), i, e, r); ov.append(b); document.body.appendChild(ov); i.focus();
});
const sha = async (t) => { try { const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('rotina:' + t)); return [...new Uint8Array(h)].map(x => x.toString(16).padStart(2, '0')).join(''); } catch (e) { return 'x:' + t; } };
const checaPin = async () => {
  let h = ler(PINKEY);
  if (!h) { const n = await pedirPin('Crie o PIN do gestor', true); if (!n) return false; gravarLS(PINKEY, await sha(n)); return true; }
  const p = await pedirPin('PIN do gestor'); if (!p) return false;
  if (await sha(p) === h) return true;
  aviso('PIN incorreto.', true); return false;
};

/* ============ tela ============ */
const quando = (iso) => new Intl.DateTimeFormat('pt-BR', { timeZone: 'America/Sao_Paulo', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }).format(new Date(iso)).replace(',', ' às');
function desenha() {
  const L = $('lista'); L.textContent = '';
  let g = -1, feitos = 0;
  itens.forEach(it => {
    if (it.gi !== g) { g = it.gi; const h = el('div', 'grp', ROTINA[g].grupo); if (ROTINA[g].quem) h.append(el('span', 'quem', ROTINA[g].quem)); L.append(h); }
    const e = est.s[it.k], feito = e && e.estado === 'feito', conf = e && e.estado === 'ok', env = e && e.estado === 'enviada', ok = feito || conf;
    if (ok) feitos++;
    const row = el('div', 'it' + (ok ? ' ok' : '')), box = el('i', 'box' + (ok ? ' on' : '')), t = el('div', 'txt');
    box.setAttribute('aria-hidden', 'true'); t.append(el('span', '', it.t));
    if (!it.foto) {
      box.style.cursor = 'pointer'; box.setAttribute('role', 'checkbox'); box.tabIndex = 0; box.setAttribute('aria-checked', ok);
      const alt = () => { if (ok) delete est.s[it.k]; else est.s[it.k] = { estado: 'ok' }; salvar(); desenha(); };
      box.addEventListener('click', alt); box.addEventListener('keydown', ev => { if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); alt(); } });
    } else {
      const a = el('div', 'acts');
      if (conf) a.append(el('small', '', 'Conferido pelo gestor'));
      else if (feito) {
        const im = el('img', 'f'); im.src = e.foto; im.alt = 'Foto do passo'; im.addEventListener('click', () => im.classList.toggle('big')); a.append(im);
        a.append(el('small', '', 'Feito. Aguardando conferência do gestor.'));
        a.append(el('small', '', 'Foto: ' + quando(e.em)));
      } else if (env) {
        const im = el('img', 'f'); im.src = e.foto; im.alt = 'Foto do passo'; im.addEventListener('click', () => im.classList.toggle('big')); a.append(im);
        a.append(el('small', '', 'Foto: ' + quando(e.em)));
        const r = el('div', 'row');
        r.append(btn('✔ Dar check', () => { est.s[it.k] = { ...e, estado: 'feito', em: new Date().toISOString() }; salvar(); desenha(); }, 'p'),
                 btn('Trocar foto', () => tirarFoto(it.k)));
        a.append(r);
      } else { const r = el('div', 'row'); r.append(btn('📷 Tirar foto', () => tirarFoto(it.k), 'p')); a.append(r); }
      t.append(a);
    }
    row.append(box, t); L.append(row);
  });
  $('conferir').hidden = !itens.some(it => est.s[it.k] && est.s[it.k].estado === 'feito');
  $('prog').textContent = feitos === itens.length ? 'Tudo pronto ✓' : `${feitos} de ${itens.length} feitos`;
  $('fill').style.width = (itens.length ? feitos / itens.length * 100 : 0) + '%';
}
$('conferir').addEventListener('click', async () => {
  if (!(await checaPin())) return;
  itens.forEach(it => { const e = est.s[it.k]; if (e && e.estado === 'feito') est.s[it.k] = { estado: 'ok', em: new Date().toISOString() }; });  // a foto some junto
  salvar(); aviso('Conferido. As fotos foram apagadas.'); desenha();
});
$('limpar').addEventListener('click', async () => { if (await checaPin()) { est = { dia: hoje, s: {} }; salvar(); aviso(''); desenha(); } });
$('trocapin').addEventListener('click', async () => {
  if (ler(PINKEY) && !(await checaPin())) return;
  const n = await pedirPin('Novo PIN do gestor', true); if (n) { gravarLS(PINKEY, await sha(n)); aviso('PIN alterado.'); }
});
if (!(() => { try { localStorage.setItem('t', '1'); localStorage.removeItem('t'); return true; } catch (e) { return false; } })()) aviso('Este navegador não guarda dados. Ao fechar a página, as marcações se perdem.', true);
desenha(); atualizaPerm();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
